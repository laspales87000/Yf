<script>
const API='https://api.tvmaze.com';
let S={shows:{},sync:0},view={f:'cours',q:'',open:null,add:0,s:null},busy=0,stop=0;
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const nm=s=>s.name||'Série '+s.id;
const aired=e=>e.w||(e.d&&e.d<=today());
const st=sh=>{const a=sh.eps.filter(aired),w=a.filter(e=>e.w).length;return{a:a.length,w,left:a.length-w,any:sh.eps.some(e=>e.w)}};
function toast(m,ms){const t=$('#toast');t.textContent=TT(m);t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',ms||Math.min(4500,1800+t.textContent.length*40))}

/* Stockage local (IndexedDB) */
const idb=new Promise(r=>{try{const q=indexedDB.open('suivi-series',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){const d=await idb;if(!d)return;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
let tm0;function save(){clearTimeout(tm0);tm0=setTimeout(async()=>{const d=await idb;if(d)d.transaction('k','readwrite').objectStore('k').put(S,'s')},400)}
async function saveNow(){clearTimeout(tm0);const d=await idb;if(!d)return;await new Promise(r=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(S,'s');t.oncomplete=t.onerror=t.onabort=()=>r()})}

/* Import */
function fromBk(j){const o={};for(const x of(j[0]||{}).Shows||[])o[x.SeriesId]={id:x.SeriesId,name:x.Name||'',status:x.Status,net:x.Network,genre:(x.Genre||'').split('|').filter(Boolean).join(', '),sum:x.Summary||'',fav:!!x.Liked,pin:!!x.Starred,arch:x.List==='1'?1:0,eps:x.Episodes.map(e=>({s:+e.Season,n:+e.Episode,t:e.Title,d:(e.Aired||'').slice(0,10),w:e.Watched==='1'?1:0,f:e.Selected?1:0}))};return{shows:o,sync:0,raw:j,mp:1}}

/* Serveur TVmaze */
async function api(p){for(let i=0;i<4;i++){const r=await fetch(API+p);if(r.status==429){await sleep(4000);continue}if(r.status==404)return null;if(!r.ok)throw Error(r.status);return r.json()}throw Error('429')}
async function syncShow(sh){
 if(!sh.tm){const x=await api('/lookup/shows?thetvdb='+sh.id);if(!x){sh.nf=1;return 0}sh.tm=x.id}
 const x=await api('/shows/'+sh.tm+'?embed[]=episodes&embed[]=images&embed[]=cast&embed[]=crew&embed[]=akas');if(!x)return 0;
 sh.name=sh.name||x.name;sh.status=x.status;sh.net=(x.network||x.webChannel||{}).name||sh.net;
 sh.genre=sh.genre||(x.genres||[]).join(', ');sh.sum=sh.sum||(x.summary||'').replace(/<[^>]+>/g,'');
 sh.img=x.image&&(x.image.medium||x.image.original);
 const im=(x._embedded.images||[]).filter(i=>i.type=='background'),b=im.find(i=>i.main)||im[0];sh.bg=b?(b.resolutions.original||b.resolutions.medium||{}).url:'';
 const was=sh.upd&&sh.v>=3,cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10),m=new Map(sh.eps.map(e=>[e.s+'-'+e.n,e]));let n=0,np=0;
 for(const e of x._embedded.episodes){if(e.number==null)continue;const o=m.get(e.season+'-'+e.number);
  const u=(e.summary||'').replace(/<[^>]+>/g,'').trim();if(o){if(e.name&&e.name!==o.t){o.t=e.name;delete o.tf}o.d=e.airdate||o.d;if(u&&u!==o.u){o.u=u;delete o.uf}}else{m.set(e.season+'-'+e.number,{s:e.season,n:e.number,t:e.name,d:e.airdate||'',u,w:0,f:0});n++;if(!e.airdate||e.airdate>=cut)np++}}
 if(was&&np&&!sh.arch){sh.pin=1;sh.mod=Date.now()}sh.eps=[...m.values()].sort((a,b)=>a.s-b.s||a.n-b.n);sh.v=6;sh.type=x.type||sh.type;{const E=x._embedded||{};sh.orig=x.name;sh.alt=[...new Set((E.akas||[]).map(a=>a.name))].filter(n=>n!==x.name).slice(0,15);sh.ppl=[...(E.cast||[]).map(c=>({id:c.person.id,n:c.person.name,c:c.character&&c.character.name,im:c.person.image&&c.person.image.medium,r:'cast'})),...(E.crew||[]).filter(c=>CREW[c.type]).slice(0,20).map(c=>({id:c.person.id,n:c.person.name,j:c.type,im:c.person.image&&c.person.image.medium,r:'crew'}))]}sh.upd=Date.now();return n}
async function update(){
 if(busy){stop=1;return}
 if(!netOk(1))return;
 busy=1;stop=0;
 const age=Date.now()-(S.sync||0);let ch=null;
 try{if(S.sync&&age<2.6e9)ch=await api('/updates/shows?since='+(age<864e5?'day':age<6048e5?'week':'month'))}catch(e){}
 const need=s=>s.src=='tmdb'?(!s.upd||Date.now()-s.upd>864e5):!s.nf&&(!s.tm||!s.upd||s.v!=6||(Date.now()-s.upd>36e5&&(ch?s.status!='Ended'||ch[s.tm]*1000>s.upd:1)));
 const needM=m=>!m.upd||m.v!=2||m.lang!==LANG()||(m.date>today()&&Date.now()-m.upd>2592e5)||Date.now()-m.upd>5184e6,L=[...Object.values(MV()).filter(needM),...Object.values(BK()).filter(b=>!b.upd),...Object.values(S.shows).filter(need)];let i=0,n=0,fail=0;
 for(const sh of L){if(stop)break;$('#prog').textContent=++i+'/'+L.length;
  try{if(sh.kind=='m')await fetchMovie(sh,0);else if(sh.kind=='b')await fetchBook(sh,0);else n+=await(sh.src=='tmdb'?syncTmdbTv(sh):syncShow(sh))}catch(e){if(++fail>2)break}
  save();if(i%10==0&&!view.open&&!view.add&&document.activeElement.id!='q')render();await sleep(sh.kind=='m'||sh.kind=='b'?250:520)}
 busy=0;$('#prog').textContent='';
 if(!stop&&fail<=2)S.sync=Date.now();
 save();render();toast(fail>2?'Connexion impossible':stop?'Mise à jour interrompue':n?n+' nouveaux épisodes':'Tout est à jour')}

/* Vues */
const card=(sh,s)=>`<article class="card ${view.sel&&view.sel[sh.id]?'sel':''}" data-act="open" data-id="${sh.id}"><div class="poster">${view.sel?`<span class="ck ${view.sel[sh.id]?'on':''}">✓</span>`:''}${sh.img?`<img loading="lazy" src="${esc(sh.img)}" alt="">`:esc(nm(sh)[0])}${s.left?`<b class="badge">${s.left}</b>`:''}${vstack(sh)}</div><h3>${esc(nm(sh))}</h3><div class="bar"><i style="width:${s.a?Math.round(100*s.w/s.a):0}%"></i></div></article>`;
const ep=(sh,e,x)=>`<div class="ep ${e.d>today()&&!e.w?'fut':''}" ${e.u?`data-act="sum" data-id="${sh.id}" data-k="${e.s}-${e.n}"`:''}><input type="checkbox" data-act="w" data-id="${sh.id}" data-k="${e.s}-${e.n}" ${e.w?'checked':''} aria-label="Vu"><div class="t"><span>${x?esc(nm(sh))+' · S'+e.s+'E'+e.n:e.n+'. '+esc(e.t||'Épisode '+e.n)}</span>${x?`<small>${esc(e.t||'')}</small>`:''}${FR()&&gl(e,'tf')&&gl(e,'tf').toLowerCase()!==(e.t||'').toLowerCase()?`<small class="tf">${esc(gl(e,'tf'))}</small>`:''}<small>${e.d?fmtDate(e.d):'date inconnue'}</small>${view.sx==sh.id+'|'+e.s+'-'+e.n?(fr(e,'u','uf'),`<p class="su">${esc(FR()&&gl(e,'uf')||e.u)}</p>`):''}</div><button class="hb ${e.f?'on':''}" data-act="ef" data-id="${sh.id}" data-k="${e.s}-${e.n}" aria-label="Épisode favori">♥</button></div>`;
const PIN='<svg class="pin" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>';
const EYE='<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
const FILT=[['cours','En cours'],['fav','Séries favorites ♥'],['eps','Épisodes favoris ♥'],['all','Toutes les séries'],['noanim','Toutes sans les dessins animés'],['anim','Dessins animés'],['arch','Archive']];
const FILTM=[['tosee','À voir'],['fav','Films favoris ♥'],['all','Tous les films'],['noanim','Tous sans les dessins animés'],['anim','Dessins animés'],['arch','Archive']];
const FILTB=[['toread','À lire'],['fav','Livres favoris ♥'],['loan','Livres prêtés 🤝'],['all','Tous les livres'],['arch','Archive']],FILTC=[['toread','À lire'],['fav','BDs favorites ♥'],['loan','BDs prêtées 🤝'],['all','Toutes les BDs'],['arch','Archive']];
const FLT=()=>({s:FILT,m:FILTM,b:FILTB,c:FILTC})[MODE()];
function renderMenu(){const m=$('#menu');m.hidden=!view.menu;m.className=(['nav','cloud','look','lang','hist','set','dfmt','about','leg','ghhelp','serpick','serlist','unipick'].includes(view.menu)?'l':'')+(['cloud','hist','about','ghhelp','serpick','serlist','unipick'].includes(view.menu)?' w':'');
 m.innerHTML=view.menu=='leg'?legHtml():view.menu=='serpick'?serPickHtml():view.menu=='serlist'?serListHtml():view.menu=='unipick'?uniPickHtml():view.menu=='set'?setHtml():view.menu=='dfmt'?dfmtHtml():view.menu=='about'?aboutHtml():view.menu=='hist'?histHtml():view.menu=='lang'?langHtml():view.menu=='cloud'?cloudHtml():view.menu=='ghhelp'?ghHelp():view.menu=='look'?lookHtml():view.menu=='nav'?`<button data-act="menu" data-m="set">⚙ Paramètres</button><button data-act="import">Importer une sauvegarde</button><button data-act="bkshare">Exporter une sauvegarde en local, cloud, ou mail</button><button data-act="menu" data-m="hist">🕘 Historique des modifications</button><button data-act="menu" data-m="about">À propos</button><button data-act="upd8">Rechercher une mise à jour</button>`:view.menu=='filt'?FLT().map(([k,l])=>`<button class="${view.f==k?'on':''}" data-act="tab" data-f="${k}">${defF()==k?'<span class="dfh" title="Liste par défaut">🏠</span>':''}${k=='arch'?`<span class="mi">${ARCH}</span>`:''}${l}</button>`).join('')+'<div class="cp"><p style="font-size:12px">🏠 = liste affichée à l’ouverture. Reste appuyé 2 secondes sur une liste pour la choisir.</p></div>':''}
const past=(sh,e)=>e.d?e.d<=today():(e.s==0||sh.status=='Ended');
const isAnim=sh=>sh.kind=='m'?(sh.gen||[]).includes(16):(sh.type=='Animation'||/animation|anime/i.test(sh.genre||''));
const noInfo=sh=>sh.status!='Ended'&&!sh.eps.some(e=>!e.w&&e.d>today())?1:0;
const dd=d=>fmtDate(d);
const nxt=sh=>sh.eps.find(e=>!e.w&&aired(e));
function sub(sh){const t=today(),f=sh.eps.filter(e=>!e.w&&e.d>t).sort((a,b)=>a.d<b.d?-1:1)[0];
 if(f){const n=Math.ceil((new Date(f.d)-new Date(t))/864e5);return`S${f.s}E${f.n} ${esc(f.t||'')} · ${n>1?'dans '+n+' jours':n==1?'demain':"aujourd'hui"}`}
 return sh.status=='Ended'?'Série terminée':"Pas d'info sur le prochain épisode"}
const tcard=sh=>{const s=st(sh),n=nxt(sh),u=sh.bg||sh.img,f=sh.eps.filter(e=>!e.w&&e.d>today()).sort((a,b)=>a.d<b.d?-1:1)[0];return`<article class="tc ${view.sel&&view.sel[sh.id]?'sel':''}" data-act="open" data-id="${sh.id}"><div class="bn" ${u?`style="background-image:url('${esc(u)}')"`:''}>${view.sel?`<span class="ck ${view.sel[sh.id]?'on':''}">✓</span>`:''}${sh.arch?`<button class="ai" data-act="archive" data-id="${sh.id}" aria-label="Remettre dans la liste" style="${view.sel?'left:46px':''}">${ARCH}</button>`:''}<button class="pinb ${sh.pin?'on':'off'}" data-act="pin" data-id="${sh.id}" aria-label="${sh.pin?'Retirer l’épingle':'Épingler en début de liste'}">${PIN}</button><button class="hrb ${sh.fav?'on':''}" data-act="fav" data-id="${sh.id}" aria-label="${sh.fav?'Retirer des favoris':'Ajouter aux favoris'}">♥</button><h3>${esc(nm(sh))}</h3><p>${sub(sh)}</p></div><div class="pg"><i style="width:${s.a?Math.round(100*s.w/s.a):0}%"></i></div><div class="nx">${n?`<span><b>${n.s}x${n.n}</b>${esc(n.t||'')}${n.d?`<small>${dd(n.d)}</small>`:''}</span><button class="eye" data-act="seen" data-id="${sh.id}" aria-label="Marquer comme vu">${EYE}</button>`:`<span>Tu es à jour${f?`<small>Prochain épisode : ${dd(f.d)}</small>`:''}</span>`}</div></article>`};
const ARCH='<svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/></svg>',UNARCH='<svg viewBox="0 0 24 24"><path d="M20.55 5.22l-1.39-1.68A1.51 1.51 0 0 0 18 3H6c-.47 0-.88.21-1.15.55L3.46 5.22C3.17 5.57 3 6.01 3 6.5V19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6.5c0-.49-.17-.93-.45-1.28zM12 9.5l5.5 5.5H14v2h-4v-2H6.5L12 9.5zM5.12 5l.82-1h12l.94 1H5.12z"/></svg>';
function renderSel(){const b=$('#selb'),n=view.sel?Object.keys(view.sel).length:0,t=(view.f=='arch'?'Remettre dans la liste':'Archiver')+' ('+n+')';
 b.hidden=!n;b.innerHTML=view.f=='arch'?UNARCH:ARCH;b.title=t;b.setAttribute('aria-label',t)}
const FR=()=>LANG()!='en',busyT=new Set(),LS=()=>LANG()=='fr'?'':'_'+LANG(),gl=(o,b)=>o[b+LS()];
async function tr(t){
 try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+LANG()+'&dt=t&q='+encodeURIComponent(t));if(!r.ok)throw 0;const j=await r.json();return j[0].map(x=>x[0]).join('')}catch(e){}
 const ss=t.match(/[^.!?]+[.!?]*\s*/g)||[t],ch=[];let c='';
 for(const s of ss){if((c+s).length>450&&c){ch.push(c);c=''}c+=s}if(c)ch.push(c);
 const out=[];for(const k of ch){const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|'+LANG()+'&q='+encodeURIComponent(k));const j=await r.json();if(j.responseStatus!=200)throw 0;out.push(j.responseData.translatedText)}
 return out.join(' ')}
async function fr(o,a,b){if(!FR()||!o[a]||o[b+LS()]||busyT.has(o))return;busyT.add(o);
 try{o[b+LS()]=await tr(o[a]);busyT.delete(o);save();render()}catch(e){toast('Traduction indisponible')}}
const busyS=new Set();
async function trT(L){

const isBk=n=>n.startsWith('sauvegarde-');
async function gbfind(){const A=AC();if(A.b)return A.b;const l=await gh('/gists?per_page=100'),f=l.find(x=>x.files&&Object.keys(x.files).some(isBk));if(f)A.b=f.id;return A.b}
const wk=()=>{const t=new Date(),d=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())),n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=d.getUTCFullYear();return y+'-W'+String(Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7)).padStart(2,'0')};
const bkLbl=n=>{const m=n.match(/(\d{4})-W(\d+)/);return m?'semaine '+(+m[2])+' de '+m[1]:n.slice(11,-5)};
let bkBusy=0;
async function autoBk(skip){if(bkBusy||!netOk(1)||!hasAny())return;const m=S.gh&&S.gh.t&&S.bkw!==wk(),k=S.bk2&&S.bk2.t&&S.bk2.bkw!==wk();if(!m&&!k)return;bkBusy=1;
 try{if(m){if(!skip)await gsync(1);await gbackup();toast('Sauvegarde '+CLN[CP()]+' de la semaine effectuée');render()}}catch(e){}
 try{if(k){await bk2Backup();render()}}catch(e){}bkBusy=0}
async function gbackupCore(){if(AP()!='gh')return cbackupCore();
 const files={['sauvegarde-'+wk()+'.json']:{content:JSON.stringify(gpay())}};
 if(await gbfind()){const g=await gh('/gists/'+AC().b);Object.keys(g.files).filter(isBk).sort().reverse().slice(11).forEach(n=>{files[n]=null});await gh('/gists/'+AC().b,{method:'PATCH',body:JSON.stringify({files})})}
 else AC().b=(await gh('/gists',{method:'POST',body:JSON.stringify({description:'Suivi séries (sauvegardes)',public:false,files})})).id;
}
async function gbackup(){await gbackupCore();S.bk=mo();S.bkw=wk();S.gh.lastbk=Date.now();save()}
async function grestore(){if(AP()!='gh')return crestore();try{
 if(!await gbfind())return toast('Aucune sauvegarde trouvée');
 const g=await gh('/gists/'+AC().b),N=Object.keys(g.files).filter(isBk).sort().reverse();
 const c=prompt('Restaurer quelle sauvegarde ?\n'+N.map((n,i)=>(i+1)+'. '+bkLbl(n)).join('\n')+'\nTape le numéro :'),f=g.files[N[(+c||0)-1]];if(!f)return;
 if(!confirm('Remplacer l’état des séries par cette sauvegarde ?'))return;
 const j=JSON.parse(f.truncated?await(await fetch(f.raw_url)).text():f.content);
 for(const r of [...Object.values(j.shows),...Object.values(j.movies||{}),...Object.values(j.books||{})])r.m=Date.now()+1;gmerge(j);save();render();toast('Sauvegarde restaurée')
}catch(e){toast('Restauration impossible')}}
