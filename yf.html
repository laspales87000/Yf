<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="theme-color" content="#ff8800"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes séries</title>
<style>
:root{--bg:#e9ecef;--sf:#fff;--s2:#e0e0e0;--tx:#212121;--mu:#757575;--ac:#ff8800;--bl:#2196f3;--fv:#e91e63;--t2:#424242;--tf:#546e7a}
:root[data-th=dark]{--bg:#12151c;--sf:#1e232d;--s2:#2d3441;--tx:#e9ecf2;--mu:#98a1b3;--t2:#c3c9d6;--tf:#90a4ae;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:var(--on);height:56px;padding:0 4px;display:flex;align-items:center;box-shadow:0 2px 4px #0005}
h1{min-width:0;overflow:hidden;font-size:18px;font-weight:500;margin:0 0 0 12px;flex:1;white-space:nowrap}
header h1 small{font-size:10px}
header small{display:inline;color:var(--on);opacity:.8}
header button{background:none;width:40px;height:44px;padding:0;border-radius:50%;flex:none}
header svg{width:24px;height:24px;fill:var(--on)}
#flb{width:auto;min-width:40px;max-width:64px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#flb small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-align:center;max-width:62px;font-size:9px;line-height:1.05;margin-top:-1px;overflow:hidden;word-break:break-word;color:var(--on);opacity:.85}
#q{display:none;flex:1;min-width:0;background:#fff3;border:0;border-radius:4px;color:var(--on);padding:8px 10px;font:inherit}
#q::placeholder{color:var(--on);opacity:.7}
header.sq h1{display:none}header.sq #q{display:block}
#menu{max-height:78vh;overflow-y:auto;position:fixed;top:52px;right:8px;background:var(--sf);border-radius:4px;box-shadow:0 4px 14px #0005;z-index:9;min-width:210px;padding:6px 0}
#menu.l{left:8px;right:auto}
#menu button{display:block;width:100%;text-align:left;background:none;border-radius:0;padding:12px 16px}
#menu .on{color:var(--ac);font-weight:700}
input.q{background:var(--sf);border:1px solid var(--s2);color:var(--tx);border-radius:4px;padding:8px 12px;font:inherit;min-width:0}
button{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:4px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);color:var(--on);font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.tabs button{white-space:nowrap;border-radius:99px}
.tabs .on{background:var(--ac);color:var(--on)}
.tc,.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list{padding:8px}
.tc{background:var(--sf);border-radius:2px;box-shadow:0 1px 3px #0004;margin-bottom:10px;overflow:hidden;cursor:pointer}
.bn{position:relative;aspect-ratio:2.6/1;background:#37474f center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 10px}
.bn:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000b)}
.bn h3,.bn p{position:relative;z-index:1;margin:0;text-shadow:0 1px 4px #000}
.bn h3{font-size:22px;font-weight:400}.bn p{font-size:15px;color:#e0e0e0}
.cp{padding:10px 16px}
#menu.w{width:min(92vw,330px)}
.lnk{display:block;margin:4px 16px;padding:10px 12px;border-radius:4px;background:var(--s2);color:var(--tx);text-align:center;text-decoration:none;font-weight:600}
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--sf);color:var(--tx);padding:8px 16px;border-radius:99px;box-shadow:0 2px 8px #0005;z-index:8;font-size:13px}
#ptr[hidden]{display:none}.cp p{margin:6px 0 0;color:var(--mu);font-size:13px}
h1 button{vertical-align:middle;margin-left:2px}
#cl.busy{animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-radius:99px;padding:5px 12px;font-size:13px;background:var(--s2)}
.chip.on{background:var(--ac);color:var(--on);display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px}
.chip.on button{background:none;color:var(--on);padding:0 6px;font-size:13px}
.bk{margin:8px;padding:12px 14px;background:#fff;border-left:4px solid var(--ac);box-shadow:0 1px 3px #0003;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bk span{flex:1 1 200px}
#dlg{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:20px}#dlg[hidden]{display:none}
.dlgc{background:var(--sf);border-radius:8px;padding:20px;max-width:360px;width:100%;box-shadow:0 8px 30px #0008}.dlgc p{color:var(--t2)}
.fvs{position:absolute;top:6px;right:6px;display:flex}
.fvb{background:none;color:#bdbdbd;padding:0;font-size:28px;line-height:1;display:grid;place-items:center;min-width:42px;height:42px}
.fvb svg{width:26px;height:26px;fill:currentColor}
.fvb.on{color:#e53935}
.fvb.hr.on{color:#e53935}
.hrt{position:absolute;top:8px;right:56px;color:#ff5a6e;font-size:22px;line-height:1;text-shadow:0 1px 3px #000;z-index:2}
.pinb.off .pin{opacity:.55}
.pinb.on .pin{fill:#ff5252}
.tabs button.mini{font-size:7.5px;padding:3px 5px;opacity:.8}
.hi{padding:8px 16px;border-bottom:1px solid var(--s2);cursor:pointer}.hi b{display:block;font-size:14px}.hi span{font-size:13px}.hi small{display:block}
.pinb{position:absolute;top:2px;right:4px;width:48px;height:48px;background:none;padding:0;z-index:3;display:grid;place-items:center}
.pinb .pin{position:static}
.pin{position:absolute;top:10px;right:12px;width:26px;height:26px;fill:#fff;z-index:2}
.pg{height:6px;background:#555}.pg i{display:block;height:100%;background:var(--ac)}
.nx{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px;min-height:46px;font-size:16px}
.nx b{color:var(--bl);font-weight:400;margin-right:6px}
.eye{background:none;width:46px;height:46px;padding:0}.eye svg{width:28px;height:28px;fill:#bdbdbd}
.fab{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;background:#448aff;color:#fff;font-size:32px;line-height:1;padding:0;box-shadow:0 4px 10px #0006;z-index:6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:8px}
.card{cursor:pointer}
.poster{position:relative;aspect-ratio:2/3;background:var(--s2);border-radius:2px;overflow:hidden;display:grid;place-items:center;font-size:36px;color:var(--mu)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.sm{width:64px;flex:none}
.badge{position:absolute;top:6px;left:6px;background:var(--ac);color:var(--on);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.star{position:absolute;top:2px;right:2px;background:none;font-size:20px;color:#fffb;padding:4px 7px;text-shadow:0 1px 3px #000}
.hb.on,.star.on{color:var(--fv)}
.act .hb.on{background:var(--ac);color:var(--on)}
.card h3{font-size:13px;margin:6px 0 4px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:4px;background:var(--s2)}.bar i{display:block;height:100%;background:var(--ac)}
.det{position:relative;padding:12px 14px 30px;max-width:760px;margin:8px auto;background:var(--sf);box-shadow:0 1px 3px #0003}
h2{margin:0 0 4px;font-size:20px;font-weight:500}
.hd{display:flex;gap:12px;margin:12px 0}.hd .poster{width:90px;flex:none}
.mu,small{color:var(--mu)}small{display:block;font-size:12px}
.sum{white-space:pre-line;color:var(--t2)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.ep{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--s2)}
.ep.fut{opacity:.5}.ep .t{flex:1;min-width:0}
.ep input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.ep .hb{background:none;font-size:20px;color:#bdbdbd}
.ep .hb.on{color:var(--fv)}
.tf{font-style:italic;color:var(--tf)}
.su{margin:6px 0 0;font-size:13px;color:var(--t2);white-space:pre-line}
.ep[data-act]{cursor:pointer}
.ep[data-act] .t>span:after{content:" ▾";color:var(--mu);font-size:12px}
#selbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 8px #0005;display:flex;gap:8px;align-items:center;padding:10px 12px;z-index:7}
#selbar[hidden]{display:none}#selbar span{flex:1;font-weight:500}#selbar button:disabled{opacity:.4}
.ck{position:absolute;top:10px;left:12px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#0006;color:transparent;display:grid;place-items:center;z-index:2;font-size:16px}
.ck.on{background:var(--ac);border-color:var(--ac);color:#fff}
.poster .ck{top:auto;bottom:6px;left:6px}
.tc.sel{outline:3px solid var(--ac);outline-offset:-3px}.card.sel .poster{outline:3px solid var(--ac);outline-offset:-3px}
.empty{text-align:center;padding:60px 20px}.pad{padding:14px}.foot{text-align:center;padding:0 14px 30px;font-size:12px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);background:#323232;color:#fff;padding:10px 16px;border-radius:4px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header id="hd">
<button data-act="menu" data-m="nav" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
<h1>Mes séries <button id="cl" data-act="menu" data-m="cloud"></button><small id="prog"></small></h1>
<input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher">
<button id="selb" data-act="selarch" hidden></button>
<button data-act="sq" aria-label="Rechercher"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
<button data-act="grid" aria-label="Changer l'affichage"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button>
<button data-act="menu" data-m="filt" aria-label="Filtrer" id="flb"><svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg><small id="fl"></small></button>
</header>
<div id="menu" hidden></div>
<main id="app"></main>
<button class="fab" data-act="add" aria-label="Ajouter une série">+</button>
<div id="dlg" hidden></div>
<div id="ptr" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept=".txt,.json" hidden>
<script>
const API='https://api.tvmaze.com';
let S={shows:{},sync:0},view={f:'cours',q:'',open:null,add:0,s:null},busy=0,stop=0;
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const nm=s=>s.name||'Série '+s.id;
const aired=e=>e.w||(e.d&&e.d<=today());
const st=sh=>{const a=sh.eps.filter(aired),w=a.filter(e=>e.w).length;return{a:a.length,w,left:a.length-w,any:sh.eps.some(e=>e.w)}};
function toast(m){const t=$('#toast');t.textContent=TT(m);t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3500)}

/* Stockage local (IndexedDB) */
const idb=new Promise(r=>{try{const q=indexedDB.open('suivi-series',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){const d=await idb;if(!d)return;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
let tm0;function save(){clearTimeout(tm0);tm0=setTimeout(async()=>{const d=await idb;if(d)d.transaction('k','readwrite').objectStore('k').put(S,'s')},400)}

/* Import sauvegarde Twee */
function fromTwee(j){const o={};for(const x of(j[0]||{}).Shows||[])o[x.SeriesId]={id:x.SeriesId,name:x.Name||'',status:x.Status,net:x.Network,genre:(x.Genre||'').split('|').filter(Boolean).join(', '),sum:x.Summary||'',fav:!!x.Liked,pin:!!x.Starred,arch:x.List==='1'?1:0,eps:x.Episodes.map(e=>({s:+e.Season,n:+e.Episode,t:e.Title,d:(e.Aired||'').slice(0,10),w:e.Watched==='1'?1:0,f:e.Selected?1:0}))};return{shows:o,sync:0,raw:j,mp:1}}

/* Serveur TVmaze */
async function api(p){for(let i=0;i<4;i++){const r=await fetch(API+p);if(r.status==429){await sleep(4000);continue}if(r.status==404)return null;if(!r.ok)throw Error(r.status);return r.json()}throw Error('429')}
async function syncShow(sh){
 if(!sh.tm){const x=await api('/lookup/shows?thetvdb='+sh.id);if(!x){sh.nf=1;return 0}sh.tm=x.id}
 const x=await api('/shows/'+sh.tm+'?embed[]=episodes&embed[]=images');if(!x)return 0;
 sh.name=sh.name||x.name;sh.status=x.status;sh.net=(x.network||x.webChannel||{}).name||sh.net;
 sh.genre=sh.genre||(x.genres||[]).join(', ');sh.sum=sh.sum||(x.summary||'').replace(/<[^>]+>/g,'');
 sh.img=x.image&&(x.image.medium||x.image.original);
 const im=(x._embedded.images||[]).filter(i=>i.type=='background'),b=im.find(i=>i.main)||im[0];sh.bg=b?(b.resolutions.original||b.resolutions.medium||{}).url:'';
 const was=sh.upd&&sh.v>=3,cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10),m=new Map(sh.eps.map(e=>[e.s+'-'+e.n,e]));let n=0,np=0;
 for(const e of x._embedded.episodes){if(e.number==null)continue;const o=m.get(e.season+'-'+e.number);
  const u=(e.summary||'').replace(/<[^>]+>/g,'').trim();if(o){if(e.name&&e.name!==o.t){o.t=e.name;delete o.tf}o.d=e.airdate||o.d;if(u&&u!==o.u){o.u=u;delete o.uf}}else{m.set(e.season+'-'+e.number,{s:e.season,n:e.number,t:e.name,d:e.airdate||'',u,w:0,f:0});n++;if(!e.airdate||e.airdate>=cut)np++}}
 if(was&&np&&!sh.arch){sh.pin=1;sh.mod=Date.now()}sh.eps=[...m.values()].sort((a,b)=>a.s-b.s||a.n-b.n);sh.v=4;sh.type=x.type||sh.type;sh.upd=Date.now();return n}
async function update(){
 if(busy){stop=1;return}
 busy=1;stop=0;
 const age=Date.now()-(S.sync||0);let ch=null;
 try{if(S.sync&&age<2.6e9)ch=await api('/updates/shows?since='+(age<864e5?'day':age<6048e5?'week':'month'))}catch(e){}
 const need=s=>!s.nf&&(!s.tm||!s.upd||s.v!=4||(Date.now()-s.upd>36e5&&(ch?s.status!='Ended'||ch[s.tm]*1000>s.upd:1)));
 const L=Object.values(S.shows).filter(need);let i=0,n=0,fail=0;
 for(const sh of L){if(stop)break;$('#prog').textContent=++i+'/'+L.length;
  try{n+=await syncShow(sh)}catch(e){if(++fail>2)break}
  save();if(i%10==0&&!view.open&&!view.add&&document.activeElement.id!='q')render();await sleep(520)}
 busy=0;$('#prog').textContent='';
 if(!stop&&fail<=2)S.sync=Date.now();
 save();render();toast(fail>2?'Connexion impossible':stop?'Mise à jour interrompue':n?n+' nouveaux épisodes':'Tout est à jour')}

/* Vues */
const card=(sh,s)=>`<article class="card ${view.sel&&view.sel[sh.id]?'sel':''}" data-act="open" data-id="${sh.id}"><div class="poster">${view.sel?`<span class="ck ${view.sel[sh.id]?'on':''}">✓</span>`:''}${sh.img?`<img loading="lazy" src="${esc(sh.img)}" alt="">`:esc(nm(sh)[0])}${s.left?`<b class="badge">${s.left}</b>`:''}<button class="star ${sh.fav?'on':''}" data-act="fav" data-id="${sh.id}" aria-label="Favori">♥</button></div><h3>${esc(nm(sh))}</h3><div class="bar"><i style="width:${s.a?Math.round(100*s.w/s.a):0}%"></i></div></article>`;
const ep=(sh,e,x)=>`<div class="ep ${e.d>today()&&!e.w?'fut':''}" ${e.u?`data-act="sum" data-id="${sh.id}" data-k="${e.s}-${e.n}"`:''}><input type="checkbox" data-act="w" data-id="${sh.id}" data-k="${e.s}-${e.n}" ${e.w?'checked':''} aria-label="Vu"><div class="t"><span>${x?esc(nm(sh))+' · S'+e.s+'E'+e.n:e.n+'. '+esc(e.t||'Épisode '+e.n)}</span>${x?`<small>${esc(e.t||'')}</small>`:''}${FR()&&gl(e,'tf')&&gl(e,'tf').toLowerCase()!==(e.t||'').toLowerCase()?`<small class="tf">${esc(gl(e,'tf'))}</small>`:''}<small>${e.d?new Date(e.d).toLocaleDateString(LOCL()):'date inconnue'}</small>${view.sx==sh.id+'|'+e.s+'-'+e.n?(fr(e,'u','uf'),`<p class="su">${esc(FR()&&gl(e,'uf')||e.u)}</p>`):''}</div><button class="hb ${e.f?'on':''}" data-act="ef" data-id="${sh.id}" data-k="${e.s}-${e.n}" aria-label="Épisode favori">♥</button></div>`;
const PIN='<svg class="pin" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>';
const EYE='<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
const FILT=[['cours','En cours'],['fav','Séries favorites ♥'],['eps','Épisodes favoris ♥'],['all','Toutes'],['noanim','Toutes sans les dessins animés'],['anim','Dessins animés']];
function renderMenu(){const m=$('#menu');m.hidden=!view.menu;m.className=(['nav','cloud','look','lang','hist'].includes(view.menu)?'l':'')+(['cloud','hist'].includes(view.menu)?' w':'');
 m.innerHTML=view.menu=='hist'?histHtml():view.menu=='lang'?langHtml():view.menu=='cloud'?cloudHtml():view.menu=='look'?lookHtml():view.menu=='nav'?`<button data-act="menu" data-m="look">🎨 Apparence</button><button data-act="import">Importer une sauvegarde</button><button data-act="bkshare">Exporter une sauvegarde en local, cloud, ou mail</button><button data-act="menu" data-m="hist">🕘 Historique des modifications</button><button data-act="menu" data-m="lang">🌐 Langue de l'application <span>${FL[LANG()]}</span></button>`:view.menu=='filt'?`<button data-act="arch">${view.arch?'← Liste principale':'📦 Voir l’archive'}</button>`+FILT.map(([k,l])=>`<button class="${view.f==k?'on':''}" data-act="tab" data-f="${k}">${l}</button>`).join(''):''}
const past=(sh,e)=>e.d?e.d<=today():(e.s==0||sh.status=='Ended');
const isAnim=sh=>sh.type=='Animation'||/animation|anime/i.test(sh.genre||'');
const noInfo=sh=>sh.status!='Ended'&&!sh.eps.some(e=>!e.w&&e.d>today())?1:0;
const dd=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4):'';
const nxt=sh=>sh.eps.find(e=>!e.w&&aired(e));
function sub(sh){const t=today(),f=sh.eps.filter(e=>!e.w&&e.d>t).sort((a,b)=>a.d<b.d?-1:1)[0];
 if(f){const n=Math.ceil((new Date(f.d)-new Date(t))/864e5);return`S${f.s}E${f.n} ${esc(f.t||'')} · ${n>1?'dans '+n+' jours':n==1?'demain':"aujourd'hui"}`}
 return sh.status=='Ended'?'Série terminée':"Pas d'info sur le prochain épisode"}

 if(f=='eps'&&!q){const r=[];for(const sh of all)for(const e of sh.eps)if(e.f&&(nm(sh)+e.t).toLowerCase().includes(q))r.push(ep(sh,e,1));return`<div class="det">${r.join('')||'<p class="mu">Aucun épisode favori. Touche ♥ sur un épisode.</p>'}</div>`}
 const T=allTags();if(view.tag&&!T.includes(view.tag))view.tag='';
 const tb=T.length?`<div class="tabs" id="tgr" style="padding:8px 8px 0">${T.map(t=>`<button class="${view.tag==t?'on':(view.tag?'mini':'')}" data-act="tagf" data-tag="${esc(t)}">${esc(tn(t))}</button>`).join('')}${view.tag?`<button class="chip" data-act="tagdel" style="background:#e53935;color:#fff;white-space:nowrap">🗑 Supprimer « ${esc(tn(view.tag))} »</button>`:''}</div>`:'';
 const L=all.filter(sh=>q||view.tag||f=='anim'||!!sh.arch==!!view.arch).map(sh=>({sh,s:st(sh)})).filter(({sh,s})=>(nm(sh)+' '+(sh.tags||[]).map(tn).join(' ')).toLowerCase().includes(q)&&(!view.tag||(sh.tags||[]).includes(view.tag))&&(q||view.tag||{cours:s.any,new:!s.any,done:s.any&&!s.left,fav:sh.fav,anim:isAnim(sh),noanim:!isAnim(sh),all:1}[f])).sort((a,b)=>(b.sh.pin?1:0)-(a.sh.pin?1:0)||(f=='cours'?noInfo(a.sh)-noInfo(b.sh):0)||nm(a.sh).localeCompare(nm(b.sh),'fr'));
 view.ids=L.map(({sh})=>sh.id);return tb+(view.grid?`<div class="grid">${L.map(({sh,s})=>card(sh,s)).join('')}</div>`:`<div class="list">${L.map(({sh})=>tcard(sh)).join('')}</div>`)+(L.length?'':'<p class="mu pad">Rien ici.</p>')+'<p class="foot">Données des séries : TVmaze.com</p>'}
function detail(sh){fr(sh,'sum','sumf');
 const s=st(sh),ss=[...new Set(sh.eps.map(e=>e.s))].sort((a,b)=>a-b);
 if(view.s==null||!ss.includes(view.s))view.s=ss.find(n=>sh.eps.some(e=>e.s==n&&!e.w&&aired(e)))??ss[ss.length-1];
 frT(sh,view.s);return`<div class="det"><button data-act="back">← Retour</button><div class="fvs"><button class="fvb ${sh.pin?'on':''}" data-act="pin" data-id="${sh.id}" aria-label="${sh.pin?'Retirer l’épingle':'Épingler en début de liste'}"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg></button><button class="fvb ${sh.arch?'on':''}" data-act="archive" data-id="${sh.id}" aria-label="${sh.arch?'Remettre dans la liste':'Archiver la série'}">${ARCH}</button><button class="fvb hr ${sh.fav?'on':''}" data-act="fav" data-id="${sh.id}" aria-label="${sh.fav?'Retirer des favoris':'Ajouter aux favoris'}">♥</button></div>
<div class="hd"><div class="poster">${sh.img?`<img src="${esc(sh.img)}" alt="">`:''}</div><div><h2>${esc(nm(sh))}</h2><p class="mu">${[sh.status,sh.net,sh.genre].filter(Boolean).map(esc).join(' – ')}<br>${s.w}/${s.a} épisodes vus</p></div></div>
<p class="sum">${esc(FR()&&gl(sh,'sumf')||sh.sum)}</p>
<div class="act"><button data-act="sync1" data-id="${sh.id}">↻ Actualiser</button><button data-act="aw" data-id="${sh.id}" ${sh.eps.every(e=>e.w||!past(sh,e))?'disabled':''}>Tout marquer vu</button><button data-act="del" data-id="${sh.id}">Supprimer</button></div>
${tagBlock(sh)}<div class="tabs" id="st">${ss.map(n=>`<button class="${n==view.s?'on':''}" data-act="season" data-n="${n}">${n?'Saison '+n:'Spéciaux'}</button>`).join('')}</div>
<div class="act"><button data-act="sw" data-id="${sh.id}" ${sh.eps.filter(e=>e.s==view.s).every(e=>e.w||!past(sh,e))?'disabled':''}>Marquer la saison vue</button></div>
${sh.eps.filter(e=>e.s==view.s).map(e=>ep(sh,e)).join('')}</div>`}
const addView=()=>`<div class="det"><button data-act="back">← Retour</button><h2 style="margin-top:12px">Ajouter une série</h2><form id="sf" class="act"><input class="q" id="aq" type="search" placeholder="Titre de la série" style="flex:1" aria-label="Titre"><button class="pri">Chercher</button></form><div id="res"></div></div>`;
async function find(){const q=$('#aq').value.trim();if(!q)return;$('#res').textContent='Recherche…';
 try{const r=await api('/search/shows?q='+encodeURIComponent(q));$('#res').innerHTML=r.slice(0,12).map(({show:x})=>`<div class="ep"><div class="poster sm">${x.image?`<img src="${esc(x.image.medium)}" alt="">`:''}</div><div class="t"><span>${esc(x.name)}</span><small>${esc([(x.premiered||'').slice(0,4),(x.network||x.webChannel||{}).name,x.status].filter(Boolean).join(' – '))}</small></div><button class="pri" data-act="addshow" data-tm="${x.id}" data-tv="${x.externals.thetvdb||''}" ${inList(x)?'disabled':''}>Ajouter</button></div>`).join('')||'<p class="mu">Aucun résultat.</p>'}catch(e){$('#res').textContent='Connexion impossible.'}}
async function addShow(tm,tv){clearQ();const id=tv||'tm'+tm;if(S.shows[id])return toast('Déjà dans ta liste');
 const sh=S.shows[id]={id,tm:+tm,name:'',sum:'',fav:0,mod:Date.now(),eps:[]};toast('Ajout…');
 try{await syncShow(sh);logEv(sh,'Série ajoutée');view.add=0;view.open=id;view.s=null;view.f='all';view.arch=0;toast('Série ajoutée')}catch(e){delete S.shows[id];toast('Connexion impossible')}save();render();scrollTo(0,0)}
function render(top){applyUI();const y=scrollY;$('.fab').hidden=!!(view.open||view.add||view.sel);renderSel();$('#hd h1').childNodes[0].nodeValue=view.arch?'Archive ':'Mes séries ';renderCloud();renderFl();renderMenu();renderDlg();
 const hs=['st','tgr'].map(id=>{const e=$('#'+id);return[id,e,e?e.scrollLeft:0]});
 $('#app').innerHTML=view.add?addView():view.open&&S.shows[view.open]?detail(S.shows[view.open]):list();
 for(const[id,o,sl]of hs){const n=$('#'+id);if(n){if(o)n.scrollLeft=sl;else{const a=n.querySelector('.on');if(a)n.scrollLeft=a.offsetLeft-n.clientWidth/2+a.offsetWidth/2}}}if(top===2){const l=view.ly||0;scrollTo(0,l);requestAnimationFrame(()=>scrollTo(0,l));setTimeout(()=>scrollTo(0,l),150)}else scrollTo(0,top?0:y);hsync();i18n()}

/* Actions */
document.addEventListener('click',async ev=>{
 if(lp){lp=0;ev.preventDefault();return}
 const el=ev.target.closest('[data-act]');if(view.menu){const keep=el&&['menu','th','ac','lang'].includes(el.dataset.act);if(!keep){const inM=ev.target.closest('#menu');view.menu=0;renderMenu();if(!inM)return}}if(!el)return;const d=el.dataset,a=d.act,sh=S.shows[d.id];let top=0;
 const ek=()=>sh.eps.find(e=>e.s+'-'+e.n===d.k);
 if(view.sel&&(a=='open'||a=='seen'||a=='fav'||a=='pin')){skipLog=1;view.sel[d.id]?delete view.sel[d.id]:view.sel[d.id]=1;if(!Object.keys(view.sel).length)view.sel=null}
 else if(a=='open'){view.ly=scrollY;view.open=d.id;view.s=null;top=1}
 else if(a=='back'){view.open=null;view.add=0;top=2}
 else if(a=='tab'){view.f=d.f;view.tag='';view.open=null;view.add=0;top=1}
 else if(a=='add'){clearQ();view.ly=scrollY;view.add=1;view.open=null;top=1}
 else if(a=='menu'){view.menu=view.menu==d.m?0:d.m;renderMenu();i18n();return}
 else if(a=='sq'){const o=$('#hd').classList.toggle('sq');if(o)$('#q').focus();else{view.q='';$('#q').value=''}top=1}
 else if(a=='grid'){view.grid=!view.grid;top=1}
 else if(a=='seen'){const n=nxt(sh);lgSeen=n;if(n)n.w=1}
 else if(a=='sum'){const k=d.id+'|'+d.k;view.sx=view.sx==k?0:k}
 else if(a=='arch'){view.arch=!view.arch;view.tag='';view.open=null;view.add=0;top=1}
 else if(a=='archive'){sh.arch=sh.arch?0:1;toast(sh.arch?'Série archivée':'Série remise dans la liste')}
 else if(a=='selmode'){view.sel={};view.open=null;view.add=0;if(view.f=='eps')view.f='all';top=1}
 else if(a=='selall'){const all=view.ids.every(i=>view.sel[i]);view.ids.forEach(i=>{all?delete view.sel[i]:view.sel[i]=1})}
 else if(a=='selarch'){const k=Object.keys(view.sel).filter(i=>S.shows[i]);k.forEach(i=>{S.shows[i].arch=view.arch?0:1;S.shows[i].mod=Date.now()});logEv(null,(view.arch?'Séries remises dans la liste : ':'Séries archivées : ')+k.length);toast((view.arch?'Séries remises dans la liste : ':'Séries archivées : ')+k.length);view.sel=null}
 else if(a=='selx')view.sel=null;
 else if(a=='gsync')return gsync().then(()=>{if(Object.values(S.shows).some(s=>!s.upd&&!s.nf))update()});
 else if(a=='gout'){S.gh=null;toast('Synchronisation désactivée')}
 else if(a=='lang')S.lang=d.v;
 else if(a=='tagdel'){const t=view.tag;if(!confirm('Supprimer le tag « '+tn(t)+' » de toutes les séries ?'))return;logEv(null,'Tag « '+tn(t)+' » supprimé partout');
  Object.values(S.shows).forEach(s=>{if((s.tags||[]).includes(t)){s.tags=s.tags.filter(x=>x!==t);s.mod=Date.now()}});view.tag='';
  if(S.gh&&S.gh.t){S.gh.dirty=1;clearTimeout(gT);gT=setTimeout(()=>gsync(1),6000)}}
 else if(a=='tagf'){clearQ();view.tag=view.tag==d.tag?'':d.tag}
 else if(a=='tagadd')addTag(sh,d.tag);
 else if(a=='tagnew'){const t=prompt('Nom du tag (ex : humour)');if(t){addTag(sh,t);logEv(sh,'Tag « '+tn(ntag(t.trim().slice(0,30)))+' » ajouté')}}
 else if(a=='tagx')sh.tags=(sh.tags||[]).filter(x=>x!==d.tag);
 else if(a=='bkshare')return bkShare();
 else if(a=='grest')return grestore();
 else if(a=='bkgo'){bkNow();toast('Copie complète enregistrée')}
 else if(a=='bklater')bkSkip=1;
 else if(a=='th')UI().th=d.v;
 else if(a=='ac')UI().ac=d.v;
 else if(a=='pin')sh.pin=!sh.pin;
 else if(a=='fav')sh.fav=!sh.fav;
 else if(a=='w'){const e=ek();e.w=el.checked?1:0;
  if(e.w){const p=sh.eps.filter(x=>x.s==e.s&&x.n<e.n&&!x.w),s=p.length>1?'s':'';
   if(p.length&&confirm('Marquer aussi comme vus les épisodes précédents de la saison '+e.s+' ('+p.length+') ?'))p.forEach(x=>x.w=1)}}
 else if(a=='ef'){const e=ek();e.f=e.f?0:1}
 else if(a=='season')view.s=+d.n;
 else if(a=='sw')sh.eps.forEach(e=>{if(e.s==view.s&&past(sh,e))e.w=1});
 else if(a=='aw')sh.eps.forEach(e=>{if(past(sh,e))e.w=1});
 else if(a=='del'){if(!confirm('Supprimer cette série ?'))return;delete S.shows[d.id];(S.del=S.del||{})[d.id]=Date.now();view.open=null;top=2}
 else if(a=='sync1'){toast('Actualisation…');try{const n=await syncShow(sh);toast(n?n+' nouveaux épisodes':'À jour')}catch(e){toast('Connexion impossible')}}
 else if(a=='update')return update();
 else if(a=='import')return $('#file').click();
 else if(a=='export'){bkNow();render();return}
 else if(a=='extw')return twExport();
 else if(a=='addshow')return addShow(d.tm,d.tv);
 if(sh&&!['open','back','tab','add','season','sum','menu','sync1','trad'].includes(a))sh.mod=Date.now();
 if(S.gh&&S.gh.t&&['fav','pin','w','ef','sw','aw','seen','archive','del','selarch','tagadd','tagnew','tagx','tagdel'].includes(a)){S.gh.dirty=1;clearTimeout(gT);gT=setTimeout(()=>gsync(1),6000)}
 if(!skipLog)logAct(a,d,sh);skipLog=0;
 save();render(top)});
document.addEventListener('submit',ev=>{if(ev.target.id=='sf'){ev.preventDefault();find()}});
let tx=0,ty=0,tOK=0;
document.addEventListener('touchstart',ev=>{const t=ev.touches[0];tx=t.clientX;ty=t.clientY;tOK=ev.touches.length==1&&!ev.target.closest('.tabs,input,#menu')},{passive:true});
document.addEventListener('touchend',ev=>{const t=ev.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(!tOK||Math.abs(dx)<80||Math.abs(dy)*2>Math.abs(dx))return;if(view.menu||!goBack())return;tOK=0},{passive:true});
let lp=0,lpT,px=0,py=0;
document.addEventListener('pointerdown',ev=>{const c=ev.target.closest('.tc,.card');if(!c||view.sel||view.menu)return;lp=0;px=ev.clientX;py=ev.clientY;clearTimeout(lpT);
 lpT=setTimeout(()=>{lp=1;view.sel={};view.sel[c.dataset.id]=1;if(navigator.vibrate)navigator.vibrate(30);render()},500)});
document.addEventListener('pointermove',ev=>{if(Math.abs(ev.clientX-px)+Math.abs(ev.clientY-py)>12)clearTimeout(lpT)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);setTimeout(()=>lp=0,400)}));
document.addEventListener('contextmenu',ev=>{if(ev.target.closest('.tc,.card'))ev.preventDefault()});
$('#q').oninput=e=>{view.q=e.target.value;if(view.q)view.tag='';if(view.open||view.add){view.open=null;view.add=0}render(1)};
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());if(j&&j.v===1&&!Array.isArray(j)){if(!confirm('Restaurer cette sauvegarde ?'))return;for(const r of Object.values(j.shows))r.m=Date.now()+1;gmerge(j);save();render(1);toast('Sauvegarde restaurée');return}const n=Array.isArray(j)?fromTwee(j):j;if(!n.shows)throw 0;
  if(Object.keys(S.shows).length&&!confirm('Remplacer les données actuelles ?'))return;
  if(!Array.isArray(j))n.raw=S.raw;n.gh=S.gh;n.ui=S.ui;S=n;view={f:'cours',q:'',open:null,add:0,s:null};save();render(1);toast(Object.keys(S.shows).length+' séries importées');update()}
 catch(err){toast('Fichier non reconnu')}};
(async()=>{try{history.scrollRestoration='manual'}catch(e){}try{if(history.state&&history.state.n)history.replaceState(null,'')}catch(e){}const d=await load();if(d)S=d;normTags();migratePin();render();if(S.gh&&S.gh.t){bkSkip=1;await gsync(1);await autoBk(1);bkSkip=0;render()}if(Object.keys(S.shows).length)update();setInterval(()=>autoBk(),36e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoBk()})})();
</script></body></html>
